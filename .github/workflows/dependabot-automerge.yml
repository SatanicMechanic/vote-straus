# Dependabot auto-merge — intentionally uses NO third-party actions (nothing to
# pin, nothing to compromise). Safe ONLY when a branch ruleset requires CI checks;
# without required checks --auto merges immediately. The skill's interlock enforces this.
name: dependabot-automerge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (merges only after required checks pass)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
